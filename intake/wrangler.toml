# Private intake form for Bollam Rishithej's details and photographs.
# Deliberately a separate Worker: the portfolio stays a static site under its
# strict CSP and is never linked from it. Served on intake.bollamrishithej.com.
name = "rishithej-intake"
main = "src/worker.js"
compatibility_date = "2026-08-01"
# Served only on its own subdomain; the workers.dev address is switched off so
# there is a single URL. Cloudflare creates the DNS record and certificate.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "intake.bollamrishithej.com", custom_domain = true },
]

# The form page is bundled into the Worker as a text module.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Answers (data/*.json) and uploaded files (uploads/*) both live here.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rishithej-intake"

# ACCESS_KEY is a secret, set with `wrangler secret put ACCESS_KEY`.
# Never put it in this file.
