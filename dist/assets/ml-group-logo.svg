  <circle cx="80" cy="12" r="3" fill="#fff2b2"/>
  <circle cx="56" cy="16" r="2.5" fill="#fff2b2"/>
  <circle cx="104" cy="16" r="2.5" fill="#fff2b2"/>
  
  <!-- Left Lion Rampant Silhouette -->
  <path d="M42 42 C40 38 34 36 30 38 C28 42 30 46 34 48 C28 50 24 56 26 62 C28 66 32 68 36 66 C32 72 34 82 40 86 C36 88 32 94 36 98 C42 100 48 94 48 88 C50 82 48 76 46 72 C48 64 48 54 42 42 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Right Lion Rampant Silhouette -->
  <path d="M118 42 C120 38 126 36 130 38 C132 42 130 46 126 48 C132 50 136 56 134 62 C132 66 128 68 124 66 C128 72 126 82 120 86 C124 88 128 94 124 98 C118 100 112 94 112 88 C110 82 112 76 114 72 C112 64 112 54 118 42 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Center Shield -->
