<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Akshara Groups Gold & Growth Vector Mark -->
  <defs>
    <linearGradient id="aksharaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="rgba(255, 215, 0, 0.05)"/>
  <!-- Gold facet diamond bar -->
  <polygon points="50,18 78,34 68,76 32,76 22,34" stroke="url(#aksharaGrad)" stroke-width="2.5" fill="none"/>
  <polyline points="22,34 50,44 78,34" stroke="url(#aksharaGrad)" stroke-width="2"/>
  <line x1="50" y1="44" x2="50" y2="76" stroke="url(#aksharaGrad)" stroke-width="2"/>
  <text x="50" y="90" font-family="'DM Mono', monospace" font-size="9" fill="#ffd700" text-anchor="middle" letter-spacing="1">AKSHARA</text>
</svg>
